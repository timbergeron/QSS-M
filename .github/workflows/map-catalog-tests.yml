name: Map catalog validation

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/map-catalog-tests.yml'
      - '.github/workflows/dependency-watch.yml'
      - 'Misc/qssm_pak/misc/qw_map*'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/map-catalog-tests.yml'
      - '.github/workflows/dependency-watch.yml'
      - 'Misc/qssm_pak/misc/qw_map*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
      - run: node --test .github/scripts/*.test.js
      - run: node .github/scripts/update-map-catalog.js --validate
