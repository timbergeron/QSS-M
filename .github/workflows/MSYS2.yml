name: Windows CI MSYS

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: w64
            arch: x86_64
            bits: 64
          - platform: w32
            arch: i686
            bits: 32
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW${{ matrix.bits }}
        update: true
        install: |
          make
          mingw-w64-${{ matrix.arch }}-gcc
          mingw-w64-${{ matrix.arch }}-binutils
          mingw-w64-${{ matrix.arch }}-pkgconf
          mingw-w64-${{ matrix.arch }}-gnutls
          mingw-w64-${{ matrix.arch }}-SDL2
          mingw-w64-${{ matrix.arch }}-opus
          mingw-w64-${{ matrix.arch }}-libvorbis
          mingw-w64-${{ matrix.arch }}-zlib
          mingw-w64-${{ matrix.arch }}-curl
          zip
          git
          dos2unix

    - name: Generate QSS-M Revision Info
      shell: bash
      run: |
        echo "Git URL:      https://github.com/timbergeron/QSS-M.git" > QSS-M-Revision.txt
        echo "Git Revision: $(git rev-parse HEAD)" >> QSS-M-Revision.txt
        echo "Git Date:     $(git log -1 --date=short --format=%cd)" >> QSS-M-Revision.txt
        echo "Compile Date: $(date)" >> QSS-M-Revision.txt
        export SOURCE_DATE_EPOCH=$(git log -1 --date=short --format=%ct)

    - name: Build and Package
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        cd Quake || {
          echo "Quake directory not found. Exiting."
          exit 1
        }
        . ../ci-version.sh

        mingw_prefix="/mingw${{ matrix.bits }}"
        target_triple="${{ matrix.arch }}-w64-mingw32"

        echo "==== MSYS2 GNUTLS DEBUG BEGIN ===="
        echo "MSYSTEM=${MSYSTEM:-<unset>}"
        echo "MINGW_PREFIX=${MINGW_PREFIX:-<unset>}"
        echo "Using workflow mingw_prefix=$mingw_prefix"
        echo "target_triple=$target_triple"
        echo "PATH=$PATH"
        echo
        echo "[tool locations]"
        command -v make || true
        command -v gcc || true
        command -v pkg-config || true
        command -v pkgconf || true
        command -v "${target_triple}-pkg-config" || true
        command -v "${target_triple}-pkgconf" || true
        ls -l /usr/bin/pkg-config /usr/bin/pkgconf 2>/dev/null || true
        ls -l "$mingw_prefix/bin/pkg-config" "$mingw_prefix/bin/pkgconf" 2>/dev/null || true
        ls -l "/usr/bin/${target_triple}-pkg-config" "/usr/bin/${target_triple}-pkgconf" 2>/dev/null || true
        echo
        echo "[installed packages]"
        pacman -Q | grep -Ei "mingw-w64-.*(gnutls|pkgconf|gcc|curl|sdl2|zlib)" || true
        echo
        echo "[gnutls package file listing]"
        pacman -Ql "mingw-w64-${{ matrix.arch }}-gnutls" | sed -n '1,200p' || true
        echo
        echo "[pkgconfig files]"
        ls -l "$mingw_prefix/lib/pkgconfig/gnutls.pc" 2>/dev/null || true
        ls -l "$mingw_prefix/share/pkgconfig" 2>/dev/null || true
        find "$mingw_prefix" -path "*/pkgconfig/gnutls.pc" -print 2>/dev/null || true
        echo
        echo "[probe pkg-config binaries]"
        pkg-config --version || true
        pkg-config --variable pc_path pkg-config || true
        pkg-config --modversion gnutls || true
        pkg-config --cflags gnutls || true
        pkg-config --libs gnutls || true
        if command -v "${target_triple}-pkg-config" >/dev/null 2>&1; then
          "${target_triple}-pkg-config" --version || true
          "${target_triple}-pkg-config" --modversion gnutls || true
          "${target_triple}-pkg-config" --cflags gnutls || true
          "${target_triple}-pkg-config" --libs gnutls || true
        fi
        echo "==== MSYS2 GNUTLS DEBUG END ===="

        # Ensure stale dependency/object files from other environments never leak in
        make -f Makefile.w64 clean >/dev/null 2>&1 || true
        make -f Makefile.w32 clean >/dev/null 2>&1 || true
        rm -f -- ./*.d ./*.o ./*.res
        find . -maxdepth 1 -type f \( -name '*.d' -o -name '*.o' -o -name '*.res' \) -delete

        # Force MinGW pkg-config explicitly and pin search paths
        export PKG_CONFIG="$mingw_prefix/bin/pkg-config"
        export PKG_CONFIG_PATH="$mingw_prefix/lib/pkgconfig:$mingw_prefix/share/pkgconfig"
        export PKG_CONFIG_LIBDIR="$mingw_prefix/lib/pkgconfig:$mingw_prefix/share/pkgconfig"
        echo "Selected PKG_CONFIG=$PKG_CONFIG"
        "$PKG_CONFIG" --version
        "$PKG_CONFIG" --variable pc_path pkg-config || true
        "$PKG_CONFIG" --modversion gnutls || true
        "$PKG_CONFIG" --cflags gnutls || true
        "$PKG_CONFIG" --libs gnutls || true

        # Fail-fast if GNUTLS cannot be resolved in this MSYS2 environment
        if ! "$PKG_CONFIG" --exists gnutls; then
          echo "ERROR: pkg-config cannot find gnutls in ${MSYSTEM}."
          echo "pkg-config path: $(command -v "$PKG_CONFIG" || true)"
          "$PKG_CONFIG" --variable pc_path pkg-config || true
          "$PKG_CONFIG" --cflags gnutls || true
          "$PKG_CONFIG" --libs gnutls || true
          pacman -Q | grep -Ei "mingw-w64-.*(gnutls|pkgconf)" || true
          exit 1
        fi

        # Set build-specific environment variables
        export QSS_CFLAGS="$(qssm_build_cflags)"
        export QSS_LDFLAGS="-Wl,--allow-multiple-definition"
        runtime_bin="/mingw${{ matrix.bits }}/bin"
        gnutls_runtime=()
        for pat in \
          "libgnutls-*.dll" \
          "libnettle-*.dll" \
          "libhogweed-*.dll" \
          "libgmp-*.dll" \
          "libidn2-*.dll" \
          "libunistring-*.dll" \
          "libtasn1-*.dll" \
          "libiconv-*.dll" \
          "libp11-kit-*.dll" \
          "libffi-*.dll"
        do
          for f in "$runtime_bin"/$pat; do
            [ -e "$f" ] || continue
            gnutls_runtime+=("$f")
          done
        done
        
        # Run the build with platform-specific makefile
        if [ "${{ matrix.platform }}" = "w64" ]; then
          make -f Makefile.w64 USE_SDL2=1 SDL_CONFIG=sdl2-config PKG_CONFIG="$PKG_CONFIG" -j8 2>&1 | tee build-w64.log
          if grep -q "gnutls not found via pkg-config" build-w64.log; then
            echo "ERROR: w64 build fell back to non-GNUTLS."
            exit 1
          fi
          mv quakespasm.exe QSS-M-w64.exe
          zip -9j QSS-M-w64.zip ../Windows/codecs/x64/*.dll ../Windows/curl/lib/x64/libcurl.dll ../Windows/zlib/x64/zlib1.dll ../LICENSE.txt ../Quakespasm.html quakespasm.pak qssm.pak gamecontrollerdb.txt ../Quakespasm.txt ../Quakespasm-Spiked.txt ../Quakespasm-Music.txt ../Windows/SDL2/lib64/SDL2.dll ../QSS-M-Revision.txt QSS-M-w64.exe "${gnutls_runtime[@]}"
        else
          make -f Makefile.w32 USE_SDL2=1 SDL_CONFIG=sdl2-config PKG_CONFIG="$PKG_CONFIG" -j8 2>&1 | tee build-w32.log
          if grep -q "gnutls not found via pkg-config" build-w32.log; then
            echo "ERROR: w32 build fell back to non-GNUTLS."
            exit 1
          fi
          mv quakespasm.exe QSS-M-w32.exe
          zip -9j QSS-M-w32.zip ../Windows/codecs/x86/*.dll ../Windows/curl/lib/x86/libcurl.dll ../Windows/zlib/x86/zlib1.dll ../LICENSE.txt ../Quakespasm.html quakespasm.pak qssm.pak gamecontrollerdb.txt ../Quakespasm.txt ../Quakespasm-Spiked.txt ../Quakespasm-Music.txt ../Windows/SDL2/lib/SDL2.dll ../QSS-M-Revision.txt QSS-M-w32.exe "${gnutls_runtime[@]}"
        fi

    - name: Verify package artifact
      shell: pwsh
      run: |
        $packageName = "QSS-M-${{ matrix.platform }}"
        $packageZip = "Quake/$packageName.zip"
        if (-not (Test-Path $packageZip)) {
          throw "Package archive not found: $packageZip"
        }

        Write-Host "===== Package archive ====="
        Get-Item $packageZip | Format-List FullName,Length
        Write-Host "===== Package archive contents ====="
        $archiveContents = tar -tf $packageZip
        $archiveContents
        foreach ($requiredFile in @("gamecontrollerdb.txt")) {
          if ($archiveContents -notcontains $requiredFile) {
            throw "Required controller support file missing from archive: $requiredFile"
          }
        }

    - name: Prepare MSYS2 debug logs
      if: always()
      shell: pwsh
      run: |
        $packageName = "QSS-M-${{ matrix.platform }}"
        $packageZip = "Quake/$packageName.zip"
        $logRoot = "artifact/logs/$packageName-logs"
        $buildLog = "Quake/build-${{ matrix.platform }}.log"

        Remove-Item $logRoot -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $logRoot | Out-Null

        if (Test-Path $buildLog) {
          Copy-Item $buildLog $logRoot
        }
        if (Test-Path "Quake") {
          Get-ChildItem "Quake" -File |
            Sort-Object FullName |
            Select-Object -ExpandProperty FullName |
            Set-Content "$logRoot/quake-files.txt"
        }
        if (Test-Path $packageZip) {
          tar -tf $packageZip | Set-Content "$logRoot/$packageName-zip-contents.txt"
        }

        Write-Host "===== Log artifact tree ====="
        Get-ChildItem "artifact/logs" -Recurse -File -ErrorAction SilentlyContinue |
          Sort-Object FullName |
          ForEach-Object { $_.FullName }

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        path: Quake/QSS-M-${{ matrix.platform }}.zip
        if-no-files-found: error
        archive: false

    - name: Upload MSYS2 debug logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: QSS-M-${{ matrix.platform }}-logs
        path: artifact/logs/QSS-M-${{ matrix.platform }}-logs
        if-no-files-found: warn
