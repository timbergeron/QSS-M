name: Windows (MSVC)

on:
  push:
    paths-ignore: &paths-ignore
      - '**/*.md'
      - 'Quakespasm*.txt'
      - 'Quakespasm*.html'
      # Dependency-watch and map-catalog tooling has its own workflows.
      # build-sdl3-linux.sh stays in scope: linux.yml builds with it.
      - '.github/scripts/*.js'
      - '.github/dependency-watch.json'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/dependency-watch.yml'
      - '.github/workflows/map-catalog.yml'
      - '.github/workflows/linux-valgrind.yml'
  pull_request:
    paths-ignore: *paths-ignore
  # Manual runs, e.g. to rebuild a commit without pushing a new one.
  workflow_dispatch:

# Keep every qsrebase push and tag build, including pending runs. Other refs
# share a group so that a newer commit cancels obsolete work in this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/qsrebase' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/qsrebase' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform == 'Win32' && 'x86' || matrix.platform }}
    runs-on: windows-2022
    # Generous on purpose: only catches hangs, never a slow cold-cache build.
    timeout-minutes: 90
    # A PR from a branch of this repository already builds on push; only
    # fork PRs need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build qssm.pak
        shell: bash
        run: bash Misc/qssm_pak/build.sh

      - name: Set environment variables
        shell: pwsh
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          $gitrev = (git describe --always)
          $runtimeGitSha = (git rev-parse --short=7 HEAD)
          $gitbranch = (git branch --show-current)
          if ($gitbranch -eq "master" -or $gitbranch -eq "main") {
            $ver_suffix = "-$gitrev"
          } else {
            $ver_suffix = "-$gitbranch-$gitrev"
          }
          $platform = $env:MATRIX_PLATFORM
          if ($platform -eq "x64") {
            $platform_alt = "win64"
            $platform_short = "x64"
            $exe_name = "QSS-M-w64.exe"
          } else {
            $platform_alt = "win32"
            $platform_short = "x86"
            $exe_name = "QSS-M-w32.exe"
          }
          # Branches and tags can contain slashes and other artifact-unsafe characters.
          $build_artifact = "QSS-M$ver_suffix-$platform_alt" -replace '[^A-Za-z0-9._-]', '-'
          # Release tags (X.Y.Z / vX.Y.Z matching quakedef.h) build without a
          # suffix; the updater treats "-" suffixes as prereleases.
          $runtimeSuffix = "-$runtimeGitSha"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+)$') {
            $tagVersion = $Matches[1]
            $header = Get-Content "Quake/quakedef.h" -Raw
            $sourceVersion = "{0}.{1}.{2}" -f `
              ([regex]::Match($header, '#define\s+QSSM_VER_MAJOR\s+(\d+)').Groups[1].Value),
              ([regex]::Match($header, '#define\s+QSSM_VER_MINOR\s+(\d+)').Groups[1].Value),
              ([regex]::Match($header, '#define\s+QSSM_VER_PATCH\s+(\d+)').Groups[1].Value)
            if ($tagVersion -eq $sourceVersion) {
              $runtimeSuffix = ""
            } else {
              Write-Host "::warning::tag $env:GITHUB_REF_NAME does not match source version $sourceVersion; keeping commit suffix"
            }
          }
          "VERSION_SUFFIX=$runtimeSuffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_ARTIFACT=$build_artifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLATFORM_SHORT=$platform_short" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_NAME=$exe_name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Computed BUILD_ARTIFACT=$build_artifact"
          Write-Host "Computed EXE_NAME=$exe_name"

      - name: Identify compiler
        id: compiler
        shell: pwsh
        run: |
          $compilerId = python Windows/build-static.py --toolchain msvc --arch $env:PLATFORM_SHORT --print-toolchain-id
          if ($LASTEXITCODE -ne 0) { throw "Compiler identification failed" }
          "fingerprint=$compilerId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache static dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/windows-static
          key: windows-static-msvc-${{ matrix.platform }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('Windows/build-static.py', 'Windows/static-sources.json', 'Windows/static-adapters/*', 'Windows/static-licenses/*') }}

      - name: Build static dependencies
        shell: pwsh
        run: |
          python Windows/build-static.py --toolchain msvc --arch $env:PLATFORM_SHORT
          if ($LASTEXITCODE -ne 0) { throw "Static dependency build failed" }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = (& "$vswhere" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1)
          if (-not $msbuild) { throw "MSBuild not found via vswhere" }
          Write-Host "MSBuild: $msbuild"
          $logFile = "msbuild-${{ matrix.platform }}.log"
          $options = @(
            "-property:Configuration=Release"
            "-property:Platform=${{ matrix.platform }}"
            "-property:QSSMVersionSuffix=$env:VERSION_SUFFIX"
            "-property:PostBuildEventUseInBuild=false"
            "-maxcpucount"
            "-verbosity:normal"
            "-fileLogger"
            "-fileLoggerParameters:LogFile=$logFile;Verbosity=diagnostic"
          )
          & $msbuild Windows\VisualStudio\quakespasm.vcxproj $options
          if (-not $?) {
            Write-Host "MSBuild failed. Dumping likely error lines from $logFile"
            if (Test-Path $logFile) {
              Write-Host "===== Error Matches ====="
              Select-String -Path $logFile -Pattern "(: error | error [A-Z]{1,4}[0-9]{3,6}:|fatal error|LNK[0-9]{4}|MSB[0-9]{4})" -CaseSensitive:$false |
                Select-Object -Last 200 |
                ForEach-Object { $_.Line } |
                Out-Host
              Write-Host "===== Tail (last 300 lines) ====="
              Get-Content $logFile -Tail 300 | Out-Host
            } else {
              Write-Host "MSBuild log file not found: $logFile"
            }
            throw "Build failed"
          }

      - name: Inspect built binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $compiledir = "Windows\VisualStudio\Build-quakespasm\$($env:PLATFORM_SHORT)\Release"
          Write-Host "Compiled directory: $compiledir"
          Get-ChildItem $compiledir -ErrorAction SilentlyContinue
          $exe = Get-ChildItem "$compiledir\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Write-Host "Built EXE: $($exe.FullName)"
            $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
            if ($dumpbin) {
              & $dumpbin.Path /dependents $exe.FullName | Tee-Object -FilePath "dumpbin-${{ matrix.platform }}.txt"
            } else {
              Write-Host "dumpbin.exe not found in PATH"
            }
          } else {
            Write-Host "No EXE found in $compiledir"
          }

      - name: Prepare package
        shell: pwsh
        run: |
          $compiledir = "Windows\VisualStudio\Build-quakespasm\$($env:PLATFORM_SHORT)\Release"
          $zipdir = "artifact\$($env:BUILD_ARTIFACT)"
          mkdir $zipdir -Force

          # Output variables for debugging
          Write-Host "Compiled directory: $compiledir"
          Write-Host "Zip directory: $zipdir"
          Write-Host "Executable name: $env:EXE_NAME"

          # Move and rename the executable
          $exeFile = Get-ChildItem "$compiledir\*.exe" | Select-Object -First 1
          if ($exeFile) {
            $targetExePath = Join-Path $zipdir $env:EXE_NAME
            if (Test-Path $targetExePath) {
              Remove-Item $targetExePath
            }
            Move-Item $exeFile.FullName $targetExePath
          } else {
            Write-Error "Executable file not found in $compiledir"
          }

          $prefix = "build/windows-static/msvc-$($env:PLATFORM_SHORT)-Release/prefix"
          Copy-Item "$prefix/third-party-licenses.txt" $zipdir
          Copy-Item "Windows/static-sources.json" $zipdir
          python Windows/verify-static.py (Join-Path $zipdir $env:EXE_NAME)
          if ($LASTEXITCODE -ne 0) { throw "Unexpected DLL dependency" }
          Copy-Item "Quake\qssm.pak" $zipdir
          Copy-Item "Quake\quakespasm.pak" $zipdir
          Copy-Item "Quake\gamecontrollerdb.txt" $zipdir
          Copy-Item "Quakespasm.html" $zipdir
          Copy-Item "Quakespasm.txt" $zipdir
          Copy-Item "Quakespasm-Music.txt" $zipdir
          Copy-Item "LICENSE.txt" $zipdir
          Write-Host "Archive staging contents:"
          Get-ChildItem $zipdir
          $requiredFiles = @($env:EXE_NAME, "qssm.pak", "quakespasm.pak", "gamecontrollerdb.txt", "third-party-licenses.txt", "static-sources.json")
          if (Get-ChildItem $zipdir -Filter *.dll) { throw "Static package contains DLLs" }
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path (Join-Path $zipdir $requiredFile))) {
              throw "Required runtime file missing from archive staging: $requiredFile"
            }
          }

      - name: Prepare build logs
        if: always()
        shell: pwsh
        run: |
          $logdir = "artifact\msbuild-logs-${{ matrix.platform }}"
          mkdir $logdir -Force

          if (Test-Path "msbuild-${{ matrix.platform }}.log") {
            Copy-Item "msbuild-${{ matrix.platform }}.log" $logdir
          }
          if (Test-Path "dumpbin-${{ matrix.platform }}.txt") {
            Copy-Item "dumpbin-${{ matrix.platform }}.txt" $logdir
          }

          Write-Host "Log staging contents:"
          Get-ChildItem $logdir -ErrorAction SilentlyContinue

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: artifact/${{ env.BUILD_ARTIFACT }}
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msbuild-logs-${{ matrix.platform }}
          path: artifact/msbuild-logs-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 14
