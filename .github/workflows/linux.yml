name: Linux CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: x64
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        set -eux
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libsdl2-dev \
          libgnutls28-dev \
          libmad0-dev \
          libopus-dev \
          libopusfile-dev \
          libvorbis-dev \
          zlib1g-dev \
          libcurl4-openssl-dev \
          zip

    - name: Verify gnutls
      run: |
        set -eux
        pkg-config --exists gnutls
        echo "gnutls found: $(pkg-config --modversion gnutls)"
        pkg-config --cflags --libs gnutls

    - name: GNUTLS Debug (Linux)
      run: |
        set -eux
        echo "Runner: $(uname -a)"
        echo "PKG_CONFIG=${PKG_CONFIG:-<unset>}"
        echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
        echo "PKG_CONFIG_LIBDIR=${PKG_CONFIG_LIBDIR:-<unset>}"
        command -v pkg-config
        pkg-config --version
        pkg-config --variable pc_path pkg-config || true
        dpkg -l | grep -E 'pkg-config|gnutls' || true
        dpkg -L libgnutls28-dev | grep 'gnutls\\.pc' || true
        find /usr/lib /usr/share -path "*/pkgconfig/gnutls.pc" -print || true
        pkg-config --modversion gnutls
        pkg-config --cflags gnutls
        pkg-config --libs gnutls

    - name: Build
      run: |
        set -euxo pipefail
        export PKG_CONFIG=pkg-config
        export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        export PKG_CONFIG_LIBDIR=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        echo "Using PKG_CONFIG=$(command -v "$PKG_CONFIG")"
        "$PKG_CONFIG" --modversion gnutls
        chmod 755 build-linux.sh
        ./build-linux.sh 2>&1 | tee build-linux.log
        if grep -q "gnutls requested but not found via pkg-config" build-linux.log; then
          echo "ERROR: Linux build fell back to non-GNUTLS build."
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: Quake/QSS-M-l64.zip
        if-no-files-found: error
        archive: false
