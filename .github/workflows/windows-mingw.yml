name: Windows (MinGW)

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'Quakespasm*.txt'
      - 'Quakespasm*.html'
      # Dependency-watch and map-catalog tooling has its own workflows.
      # build-sdl3-linux.sh stays in scope: linux.yml builds with it.
      - '.github/scripts/*.js'
      - '.github/dependency-watch.json'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/dependency-watch.yml'
      - '.github/workflows/map-catalog.yml'
      - '.github/workflows/linux-valgrind.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'Quakespasm*.txt'
      - 'Quakespasm*.html'
      # Dependency-watch and map-catalog tooling has its own workflows.
      # build-sdl3-linux.sh stays in scope: linux.yml builds with it.
      - '.github/scripts/*.js'
      - '.github/dependency-watch.json'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/dependency-watch.yml'
      - '.github/workflows/map-catalog.yml'
      - '.github/workflows/linux-valgrind.yml'

# Keep every qsrebase push and tag build, including pending runs. Other refs
# share a group so that a newer commit cancels obsolete work in this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/qsrebase' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/qsrebase' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    # Generous on purpose: only catches hangs, never a slow cold-cache build.
    timeout-minutes: 90
    # A PR from a branch of this repository already builds on push; only
    # fork PRs need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: w64
            arch: x64
          - platform: w32
            arch: x86
    steps:
    - uses: actions/checkout@v6

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build pkg-config \
          autoconf automake libtool gettext texinfo gperf bison flex \
          mingw-w64 curl xz-utils zip

    - name: Identify compiler
      id: compiler
      shell: bash
      run: |
        set -euo pipefail
        compiler_id=$(python3 Windows/build-static.py --arch ${{ matrix.arch }} --print-toolchain-id)
        echo "fingerprint=$compiler_id" >> "$GITHUB_OUTPUT"

    - name: Cache static dependencies
      uses: actions/cache@v5
      with:
        path: build/windows-static
        key: windows-static-${{ runner.os }}-${{ matrix.arch }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('Windows/build-static.py', 'Windows/static-sources.json', 'Windows/static-adapters/*', 'Windows/static-licenses/*') }}

    - name: Build qssm.pak
      run: bash Misc/qssm_pak/build.sh

    - name: Test packaging and update validation
      run: |
        python3 -m unittest discover -s Misc/stress -p test_release_archives.py
        python3 -m unittest discover -s Misc/stress -p test_windows_static.py

    - name: Build and verify package
      shell: bash
      run: |
        set -euo pipefail
        sh ./build-${{ matrix.platform }}.sh 2>&1 | tee build-${{ matrix.platform }}.log

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      with:
        path: Quake/QSS-M-${{ matrix.platform }}.zip
        if-no-files-found: error
        archive: false

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: QSS-M-${{ matrix.platform }}-logs
        path: build-${{ matrix.platform }}.log
        if-no-files-found: warn
