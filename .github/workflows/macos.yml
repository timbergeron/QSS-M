name: macOS CI (Xcode)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: arm64-universal
    # Pin the major macOS image to avoid surprise `macos-latest` migrations
    # changing the toolchain and invalidating caches unexpectedly.
    runs-on: macos-15
    strategy:
      fail-fast: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      VCPKG_CACHE_REV: "v1"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      VCPKG_DISABLE_METRICS: "1"

    steps:
    - uses: actions/checkout@v6

    - name: Compute vcpkg cache key inputs
      id: vcpkg-cache
      shell: bash
      run: |
          image_os="${ImageOS:-$(sw_vers -productVersion)}"
          image_version="${ImageVersion:-unknown}"
          xcode_version="$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/ $//')"
          xcode_hash="$(printf '%s' "$xcode_version" | shasum -a 256 | cut -d' ' -f1)"
          echo "image_os=$image_os" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "xcode_hash=$xcode_hash" >> "$GITHUB_OUTPUT"
          echo "Using ImageOS=$image_os"
          echo "Using ImageVersion=$image_version"
          echo "Using Xcode=$xcode_version"

    - name: Cache vcpkg artifacts
      id: vcpkg-cache-restore
      uses: actions/cache@v5
      with:
        path: |
          ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          ${{ env.VCPKG_DOWNLOADS }}
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ env.VCPKG_CACHE_REV }}-${{ steps.vcpkg-cache.outputs.image_os }}-${{ steps.vcpkg-cache.outputs.image_version }}-${{ steps.vcpkg-cache.outputs.xcode_hash }}-${{ hashFiles('MacOSX/setup-vcpkg.sh', 'MacOSX/custom-triplets/*.cmake', 'MacOSX/vcpkg-patches/*.patch') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ env.VCPKG_CACHE_REV }}-${{ steps.vcpkg-cache.outputs.image_os }}-${{ steps.vcpkg-cache.outputs.image_version }}-${{ steps.vcpkg-cache.outputs.xcode_hash }}-
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ env.VCPKG_CACHE_REV }}-

    - name: Report cache restore result
      run: |
          if [ "${{ steps.vcpkg-cache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "actions/cache exact key hit"
          elif [ "${{ steps.vcpkg-cache-restore.outputs.cache-hit }}" = "false" ]; then
            echo "actions/cache restored from a partial or restore-key match"
          else
            echo "actions/cache miss"
          fi

    - name: Debug environment (pre-install)
      run: |
          echo "=== Runner info ==="
          uname -a
          sw_vers
          echo ""
          echo "=== Current PATH ==="
          echo "$PATH" | tr ':' '\n'
          echo ""
          echo "=== Homebrew location ==="
          which brew 2>/dev/null || echo "brew not in PATH"
          ls -la /opt/homebrew/bin/brew 2>/dev/null || echo "/opt/homebrew/bin/brew not found"
          ls -la /usr/local/bin/brew 2>/dev/null || echo "/usr/local/bin/brew not found"
          echo ""
          echo "=== Check tools BEFORE brew install ==="
          echo "autoconf: $(command -v autoconf 2>/dev/null || echo 'NOT FOUND')"
          echo "automake: $(command -v automake 2>/dev/null || echo 'NOT FOUND')"
          echo "libtool:  $(command -v libtool 2>/dev/null || echo 'NOT FOUND')"
          echo "libtoolize: $(command -v libtoolize 2>/dev/null || echo 'NOT FOUND')"
          echo "glibtoolize: $(command -v glibtoolize 2>/dev/null || echo 'NOT FOUND')"
          echo "pkg-config: $(command -v pkg-config 2>/dev/null || echo 'NOT FOUND')"
          echo "git: $(command -v git 2>/dev/null || echo 'NOT FOUND')"
          echo "lipo: $(command -v lipo 2>/dev/null || echo 'NOT FOUND')"
          echo "xcodebuild: $(command -v xcodebuild 2>/dev/null || echo 'NOT FOUND')"

    - name: Setup Homebrew and install dependencies
      run: |
          echo "=== Evaluating brew shellenv ==="
          if [ -x /opt/homebrew/bin/brew ]; then
            echo "Using /opt/homebrew/bin/brew"
            eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [ -x /usr/local/bin/brew ]; then
            echo "Using /usr/local/bin/brew"
            eval "$(/usr/local/bin/brew shellenv)"
          else
            echo "ERROR: brew not found at either location!"
            exit 1
          fi
          echo ""
          echo "=== PATH after brew shellenv ==="
          echo "$PATH" | tr ':' '\n'
          echo ""
          echo "=== Removing unused Homebrew runner taps ==="
          brew untap aws/tap >/dev/null 2>&1 || true
          echo ""
          echo "=== Installing packages ==="
          brew install autoconf automake libtool autoconf-archive pkg-config
          echo ""
          echo "=== Verify installed tools ==="
          echo "autoconf: $(command -v autoconf) -> $(autoconf --version | head -1)"
          echo "automake: $(command -v automake) -> $(automake --version | head -1)"
          echo "libtoolize: $(command -v libtoolize 2>/dev/null || echo 'NOT FOUND')"
          echo "glibtoolize: $(command -v glibtoolize 2>/dev/null || echo 'NOT FOUND')"
          echo "pkg-config: $(command -v pkg-config) -> $(pkg-config --version)"
          echo ""
          echo "=== Homebrew prefix ==="
          brew --prefix
          echo "=== Homebrew bin contents (autotools related) ==="
          ls -la "$(brew --prefix)/bin/"*libtool* 2>/dev/null || echo "no libtool binaries in brew bin"
          ls -la "$(brew --prefix)/bin/"*auto* 2>/dev/null || echo "no auto* binaries in brew bin"

    - name: Debug environment (post-install)
      run: |
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null || true)"
          echo "=== PATH in new shell step ==="
          echo "$PATH" | tr ':' '\n'
          echo ""
          echo "=== Tool check in new shell step ==="
          echo "autoconf: $(command -v autoconf 2>/dev/null || echo 'NOT FOUND')"
          echo "automake: $(command -v automake 2>/dev/null || echo 'NOT FOUND')"
          echo "libtoolize: $(command -v libtoolize 2>/dev/null || echo 'NOT FOUND')"
          echo "glibtoolize: $(command -v glibtoolize 2>/dev/null || echo 'NOT FOUND')"
          echo "pkg-config: $(command -v pkg-config 2>/dev/null || echo 'NOT FOUND')"
          echo ""
          echo "=== setup-vcpkg.sh will check these ==="
          for cmd in git lipo autoconf automake pkg-config; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "  $cmd: OK ($(command -v $cmd))"
            else
              echo "  $cmd: MISSING"
            fi
          done
          echo ""
          echo "=== libtoolize shim logic preview ==="
          if command -v libtoolize >/dev/null 2>&1; then
            echo "  libtoolize found natively at $(command -v libtoolize)"
          elif command -v glibtoolize >/dev/null 2>&1; then
            echo "  glibtoolize found at $(command -v glibtoolize) -- shim will be created"
          else
            echo "  NEITHER libtoolize NOR glibtoolize found -- this will FAIL"
          fi

    - name: Build
      run: |
          set -o pipefail
          echo "=== Build step starting ==="
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null || true)"
          echo "PATH: $PATH"
          echo "autoconf: $(command -v autoconf 2>/dev/null || echo 'NOT FOUND')"
          echo "automake: $(command -v automake 2>/dev/null || echo 'NOT FOUND')"
          echo "glibtoolize: $(command -v glibtoolize 2>/dev/null || echo 'NOT FOUND')"
          echo "pkg-config: $(command -v pkg-config 2>/dev/null || echo 'NOT FOUND')"
          echo ""
          cd MacOSX
          echo "=== Running build-macos.sh ==="
          build_rc=0
          ./build-macos.sh 2>&1 | tee build-macos.log || build_rc=$?
          if [ "$build_rc" -ne 0 ]; then
            echo "Build failed with rc=$build_rc. Tail of log follows:"
            tail -n 400 build-macos.log || true
            exit "$build_rc"
          fi

    - name: Prepare macOS debug logs
      if: always()
      run: |
          set -euxo pipefail
          package_zip="MacOSX/build/Release/QSS-M-macOS.zip"
          log_root="artifact/logs/QSS-M-macOS-logs"

          rm -rf "$log_root"
          mkdir -p "$log_root"

          if [ -f MacOSX/build-macos.log ]; then
            cp MacOSX/build-macos.log "$log_root/"
          fi
          if [ -d MacOSX/build/Release ]; then
            find MacOSX/build/Release -maxdepth 2 -type f | sort > "$log_root/release-files.txt"
          fi
          if [ -f "$package_zip" ]; then
            unzip -l "$package_zip" > "$log_root/QSS-M-macOS-zip-contents.txt"
          fi

          echo "===== Log artifact tree ====="
          find artifact/logs -maxdepth 3 -type f | sort

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v7
      with:
        path: MacOSX/build/Release/QSS-M-macOS.zip
        if-no-files-found: error
        archive: false

    - name: Upload macOS debug logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: QSS-M-macOS-logs
        path: artifact/logs/QSS-M-macOS-logs
        if-no-files-found: warn
