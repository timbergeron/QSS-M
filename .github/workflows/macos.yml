name: macOS

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'Quakespasm*.txt'
      - 'Quakespasm*.html'
      # Dependency-watch and map-catalog tooling has its own workflows.
      # build-sdl3-linux.sh stays in scope: linux.yml builds with it.
      - '.github/scripts/*.js'
      - '.github/dependency-watch.json'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/dependency-watch.yml'
      - '.github/workflows/map-catalog.yml'
      - '.github/workflows/linux-valgrind.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'Quakespasm*.txt'
      - 'Quakespasm*.html'
      # Dependency-watch and map-catalog tooling has its own workflows.
      # build-sdl3-linux.sh stays in scope: linux.yml builds with it.
      - '.github/scripts/*.js'
      - '.github/dependency-watch.json'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/dependency-watch.yml'
      - '.github/workflows/map-catalog.yml'
      - '.github/workflows/linux-valgrind.yml'

# Keep every qsrebase push and tag build, including pending runs. Other refs
# share a group so that a newer commit cancels obsolete work in this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/qsrebase' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/qsrebase' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    # One job builds both slices into the universal app.
    name: Universal
    # Pin the OS and host architecture. The macos-15 arm64 pool has failed
    # to allocate runners; the Intel host still builds both release slices.
    runs-on: macos-15-intel
    # Generous on purpose: only catches hangs, never a slow cold-cache build.
    timeout-minutes: 90
    # A PR from a branch of this repository already builds on push; only
    # fork PRs need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      VCPKG_CACHE_REV: "v2"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      VCPKG_DISABLE_METRICS: "1"

    steps:
    - uses: actions/checkout@v6

    - name: Build qssm.pak
      run: bash Misc/qssm_pak/build.sh

    - name: Compute vcpkg cache key inputs
      id: vcpkg-cache
      shell: bash
      run: |
          image_os="${ImageOS:-$(sw_vers -productVersion)}"
          image_version="${ImageVersion:-unknown}"
          xcode_version="$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/ $//')"
          xcode_hash="$(printf '%s' "$xcode_version" | shasum -a 256 | cut -d' ' -f1)"
          echo "image_os=$image_os" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "xcode_hash=$xcode_hash" >> "$GITHUB_OUTPUT"
          echo "Using ImageOS=$image_os"
          echo "Using ImageVersion=$image_version"
          echo "Using Xcode=$xcode_version"

    - name: Cache vcpkg artifacts
      id: vcpkg-cache-restore
      uses: actions/cache@v5
      with:
        path: |
          ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          ${{ env.VCPKG_DOWNLOADS }}
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ env.VCPKG_CACHE_REV }}-${{ steps.vcpkg-cache.outputs.image_os }}-${{ steps.vcpkg-cache.outputs.image_version }}-${{ steps.vcpkg-cache.outputs.xcode_hash }}-${{ hashFiles('macOS/setup-vcpkg.sh', 'macOS/custom-triplets/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ env.VCPKG_CACHE_REV }}-${{ steps.vcpkg-cache.outputs.image_os }}-${{ steps.vcpkg-cache.outputs.image_version }}-${{ steps.vcpkg-cache.outputs.xcode_hash }}-
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ env.VCPKG_CACHE_REV }}-

    - name: Report cache restore result
      run: |
          if [ "${{ steps.vcpkg-cache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "actions/cache exact key hit"
          elif [ "${{ steps.vcpkg-cache-restore.outputs.cache-hit }}" = "false" ]; then
            echo "actions/cache restored from a partial or restore-key match"
          else
            echo "actions/cache miss"
          fi

    - name: Setup Homebrew and install dependencies
      run: |
          set -euo pipefail
          # Intel runners keep Homebrew in /usr/local, Apple Silicon in /opt/homebrew.
          for brew in /opt/homebrew/bin/brew /usr/local/bin/brew; do
            if [ -x "$brew" ]; then
              eval "$("$brew" shellenv)"
              break
            fi
          done
          if ! command -v brew >/dev/null 2>&1; then
            echo "ERROR: Homebrew not found in /opt/homebrew or /usr/local"
            exit 1
          fi
          # Later steps see the same Homebrew without re-evaluating shellenv.
          echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX" >> "$GITHUB_ENV"
          echo "$HOMEBREW_PREFIX/sbin" >> "$GITHUB_PATH"
          echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install autoconf automake libtool autoconf-archive pkg-config
          echo "Runner: $(uname -m), macOS $(sw_vers -productVersion), Homebrew at $HOMEBREW_PREFIX"
          # setup-vcpkg.sh requires these and shims glibtoolize as libtoolize.
          for cmd in git lipo perl autoconf automake glibtoolize pkg-config xcodebuild; do
            echo "  $cmd: $(command -v "$cmd" || echo MISSING)"
          done

    # Apple Clang can prefer /usr/local/include to vcpkg's -isystem paths.
    # Keep Homebrew's headers/pkg-config files out of the pinned library build;
    # unlinking leaves the Cellar and opt paths used by build tools intact.
    - name: Isolate vcpkg dependencies from Homebrew
      run: |
          set -euo pipefail
          installed_formulas=$(brew list --formula --versions)
          dependencies=()
          while read -r formula versions; do
            case "$formula" in
              flac|gmp|gnutls|libidn2|libmad|libogg|libtasn1|libunistring|libvorbis|libxmp|nettle|opus|opusfile|zlib)
                echo "$formula $versions"
                dependencies+=("$formula")
                ;;
            esac
          done <<< "$installed_formulas"
          if [ -n "${dependencies[*]-}" ]; then
            brew unlink "${dependencies[@]}"
          fi
          if [ -e "$HOMEBREW_PREFIX/include/nettle/sha3.h" ]; then
            echo "Non-vcpkg Nettle headers remain visible in the Homebrew include directory."
            exit 1
          fi

    - name: Build
      run: |
          set -o pipefail
          cd macOS
          echo "=== Running build-macos.sh ==="
          build_rc=0
          ./build-macos.sh 2>&1 | tee build-macos.log || build_rc=$?
          if [ "$build_rc" -ne 0 ]; then
            echo "Build failed with rc=$build_rc. Tail of log follows:"
            tail -n 400 build-macos.log || true
            exit "$build_rc"
          fi

    - name: Prepare macOS debug logs
      if: always()
      run: |
          set -euxo pipefail
          package_zip="macOS/build/Release/QSS-M-macOS.zip"
          package_dmg="macOS/build/Release/QSS-M-macOS.dmg"
          log_root="artifact/logs/QSS-M-macOS-logs"

          rm -rf "$log_root"
          mkdir -p "$log_root"

          if [ -f macOS/build-macos.log ]; then
            cp macOS/build-macos.log "$log_root/"
          fi
          if [ -d macOS/build/Release ]; then
            find macOS/build/Release -maxdepth 2 -type f | sort > "$log_root/release-files.txt"
          fi
          if [ -f "$package_zip" ]; then
            unzip -l "$package_zip" > "$log_root/QSS-M-macOS-zip-contents.txt"
            for required_file in gamecontrollerdb.txt; do
              unzip -Z1 "$package_zip" | grep -Fx "$required_file" >/dev/null || {
                echo "Required controller support file missing from archive: $required_file"
                exit 1
              }
            done
          fi
          if [ -f "$package_dmg" ]; then
            hdiutil imageinfo "$package_dmg" > "$log_root/QSS-M-macOS-dmg-info.txt"
          fi

          echo "===== Log artifact tree ====="
          find artifact/logs -maxdepth 3 -type f | sort

    - name: Upload macOS ZIP artifact
      uses: actions/upload-artifact@v7
      with:
        path: macOS/build/Release/QSS-M-macOS.zip
        if-no-files-found: error
        archive: false

    - name: Upload macOS DMG artifact
      uses: actions/upload-artifact@v7
      with:
        path: macOS/build/Release/QSS-M-macOS.dmg
        if-no-files-found: error
        archive: false

    - name: Upload macOS debug logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: QSS-M-macOS-logs
        path: artifact/logs/QSS-M-macOS-logs
        if-no-files-found: warn
