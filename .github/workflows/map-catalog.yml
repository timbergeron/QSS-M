name: Map Catalog

on:
  push:
    paths: &paths
      - '.github/scripts/**'
      - '.github/map-catalog-snapshot.json'
      - '.github/workflows/map-catalog.yml'
      - '.github/workflows/dependency-watch.yml'
      - 'Misc/qssm_pak/misc/qw_map*'
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A PR from a branch of this repository already builds on push; only
    # fork PRs need the pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
      - name: Run unit tests
        run: node --test .github/scripts/*.test.js
      - name: Validate bundled map catalog
        run: node .github/scripts/update-map-catalog.js --validate
