// hazed slime

// spheres swell half sunk in the surface, settle, and burst, leaving a contact ring and a
// ripple. particles can't see the surface they sit on, so each stock slime gets its
// own tint of one neutral sprite, chosen so the sprite's body lands on that texture's
// average colour. rotationstart 225 keeps the sprite upright: an unrotated particle
// quad is a diamond. each dome emits its ring, and the ring fires the pop.
//
// a failed spawnchance ends the rest of its chain, so:
//  - the tiers below cascade: tiny .3, small .165, medium .066, large .013, slow .004
//  - tiers that pass share one spawn point, so spawnorg scatters them, which also
//    makes the loose clusters. without it they stack up as nested domes
//  - droplets go last in a pop chain, or a miss would also cancel the ripple
//
// medium and larger pops emit a fainter second ripple 0.2s after the first.
//
// the burst is a flat splash on the surface: atlas frames can't animate, so each
// slimeburstN shows one frame of slimecrown.png and emits the next 0.04s later. they
// share a rotation per size, so the frames line up. the dome collapses into frame 0.
//
// timing: ramp keys are evenly spaced over die and the last key holds. a dome has N
// keys and bursts between the last two (pop = die * (N-2)/N). its ring has 12 keys,
// die = pop * 1.2 and emitstart = pop - 0.01, so the ring tracks the dome and the pop
// lands on the burst. change die, change all three. keep die/N near 0.09 for a sharp
// burst. the sprite is a full sphere with a faint lower half: it faces the viewer, so a
// half dome looks cut off from above, and translucent slime writes no depth to hide the
// lower half. velbias lifts it about 20% of its radius by the pop.

// faint vapour: fades in, so it never pops on
r_part tex_*slime
{
	texture "particles/images/smokelite"
	count 1
	blend add
	die 2.4
	veladd 0
	randomvel 8
	gravity -8
	rotationstart 0 360
	rotationspeed -8 8
	scalefactor 1
	spawnmode ball
	orgbias 0 0 -6
	rampmode lerp
	ramp 100 185 105 0 16
	ramp 100 185 105 0.16 20
	ramp 100 185 105 0.14 23
	ramp 100 185 105 0.1 26
	ramp 100 185 105 0.05 29
	ramp 100 185 105 0 32
}

